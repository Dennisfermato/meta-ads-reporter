name: Daily Meta Ads Report

on:
  schedule:
    - cron: "0 7 * * *"   # 9:00 AM CEST — yesterday's report
    - cron: "0 10 * * *"  # 12:00 PM CEST — today so far
    - cron: "20 15 * * *"  # 17:20 CEST (15:20 UTC) — today so far
  workflow_dispatch: # allows manual trigger from GitHub UI
    inputs:
      accounts:
        description: "Which accounts to report (all, cz, hu)"
        required: false
        default: "all"
      date_preset:
        description: "Force date range (auto, yesterday, today)"
        required: false
        default: "auto"
      mode:
        description: "Script to run (report, video_analysis, campaign_status)"
        required: false
        default: "report"
      video_days_back:
        description: "Lookback window for video analysis (30 or 90)"
        required: false
        default: "90"

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Meta script
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID_CZ: ${{ secrets.META_AD_ACCOUNT_ID_CZ }}
          META_AD_ACCOUNT_ID_HU: ${{ secrets.META_AD_ACCOUNT_ID_HU }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          REPORT_ACCOUNTS: ${{ github.event.inputs.accounts || 'all' }}
          FORCE_DATE_PRESET: ${{ github.event.inputs.date_preset || 'auto' }}
          VIDEO_REPORT_ACCOUNT: ${{ github.event.inputs.accounts || 'cz' }}
          VIDEO_REPORT_DATE_PRESET: ${{ github.event.inputs.video_days_back == '30' && 'last_30d' || 'last_90d' }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "video_analysis" ]; then
            python scripts/video_ad_report.py
          elif [ "${{ github.event.inputs.mode }}" = "campaign_status" ]; then
            python scripts/campaign_status.py
          else
            python scripts/meta_report.py
          fi
